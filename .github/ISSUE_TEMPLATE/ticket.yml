name: Ticket
description: A unit of work for the crew
labels: ["backlog"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What needs to be built, in a sentence or two.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Specific, checkable conditions that mean this is done.
      value: |
        - [ ] 
        - [ ] 
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes / context
      description: Constraints, links, edge cases — anything useful.
    validations:
      required: false
